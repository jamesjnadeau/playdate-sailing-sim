name: PR check

# Read-only on purpose: fork PRs run with a read-only token, and nothing here needs more.
on: pull_request

permissions:
  contents: read

env:
  PLAYDATE_SDK_VERSION: "3.1.2"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: sudo apt-get install -y --no-install-recommends python3-pil

      # The SDK licence does not allow redistributing its headers, so fetch it from Panic.
      - name: Cache Playdate SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/playdate-sdk
          key: playdate-sdk-${{ env.PLAYDATE_SDK_VERSION }}

      - name: Download Playdate SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/playdate-sdk
          curl -fsSL "https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-${PLAYDATE_SDK_VERSION}.tar.gz" \
            | tar -xz -C ~/playdate-sdk --strip-components=1

      - name: Unit tests
        run: make -C tests test

      - name: Validate and render boats
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          PD_API_INCLUDE="$HOME/playdate-sdk/C_API" tools/pr_check.sh "origin/$BASE_REF" out

      - name: Job summary
        if: always()
        run: '[ -f out/summary.md ] && cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Upload clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-clips
          path: out/*.gif
          if-no-files-found: ignore
