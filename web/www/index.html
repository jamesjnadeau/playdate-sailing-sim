<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Crank'n Sail</title>
  <meta name="description" content="A sailing simulator: the Playdate game's own physics in the browser, with a 3D view.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="view" aria-label="The sea and your boat"></canvas>
  <div id="hud" hidden></div>
  <div id="menu" hidden></div>
  <div id="sysmenu" hidden></div>
  <div id="touch" hidden></div>
  <button id="fullscreen" hidden aria-label="Full screen" title="Full screen">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="fs-enter" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
      <path class="fs-leave" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>
    </svg>
  </button>
  <div id="rotate"><div>↻</div>Turn your phone sideways to sail</div>
  <div id="about" hidden></div>
  <div id="lock-hint"><span class="mouse-only">Click the view to use the mouse as the crank · <span class="key">Backspace</span> menu</span><span class="touch-only">Drag up and down on the view to turn the crank</span></div>
  <div id="status">Loading…</div>
  <noscript><div id="status">Crank'n Sail needs JavaScript and WebGL.</div></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
